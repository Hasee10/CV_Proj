<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240"><rect width="900" height="1240" fill="#eeeee4"/><g font-family="Arial, sans-serif" fill="#163330"><text x="66" y="88" font-size="23" letter-spacing="-1">ChequeVerify.</text><text x="834" y="88" text-anchor="end" font-family="monospace" font-size="15">02 / 06</text><path d="M66 116H834" stroke="#526b60" stroke-width="1"/><text x="66" y="183" font-family="monospace" font-size="16" letter-spacing="3" fill="#526b60">THE QUESTION</text><text x="60" y="292" font-size="86" letter-spacing="-5">One cheque.</text><text x="60" y="388" font-size="86" letter-spacing="-5">Two expressions.</text><g stroke="#577866" fill="none" stroke-width="2" opacity=".7"><rect x="66" y="454" width="768" height="190"/><path d="M96 510H620M96 556H550M96 600H740"/><rect x="640" y="550" width="160" height="60"/></g><text x="66" y="735" font-size="29" fill="#526b60">The amount in figures.</text><text x="66" y="784" font-size="29" fill="#526b60">The amount in English words.</text><text x="66" y="833" font-size="29" fill="#526b60"></text><text x="66" y="882" font-size="29" fill="#526b60">Select both fields. Read their values.</text><text x="66" y="931" font-size="29" fill="#526b60">Compare what the model recognises.</text><path d="M66 1130H834" stroke="#526b60"/><text x="66" y="1178" font-size="19" fill="#526b60">Field selection is manual. No automatic detection.</text></g></svg>